<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Comunio Mundial 2026">
  <defs>
    <radialGradient id="com-bg" cx="35%" cy="26%" r="88%">
      <stop offset="0%" stop-color="#2A2350"/>
      <stop offset="55%" stop-color="#151233"/>
      <stop offset="100%" stop-color="#080718"/>
    </radialGradient>
    <linearGradient id="com-gold" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#FBE38A"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8A6A16"/>
    </linearGradient>
    <linearGradient id="com-gold2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0D27A"/>
      <stop offset="100%" stop-color="#B8912A"/>
    </linearGradient>
    <radialGradient id="com-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="160" cy="160" r="160" fill="url(#com-bg)"/>
  <circle cx="160" cy="146" r="96" fill="url(#com-glow)"/>

  <!-- podio de la clasificación -->
  <g>
    <rect x="66" y="214" width="52" height="40" rx="4" fill="#2E2758"/>
    <rect x="122" y="196" width="52" height="58" rx="4" fill="#3B3270"/>
    <rect x="178" y="224" width="52" height="30" rx="4" fill="#282252"/>
    <g fill="#B9AEE8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">
      <text x="92" y="240">2</text>
      <text x="148" y="228">1</text>
      <text x="204" y="246">3</text>
    </g>
  </g>

  <!-- trofeo -->
  <g transform="translate(160 132)">
    <!-- asas -->
    <path d="M-34 -34 h-16 a16 16 0 0 0 16 30" fill="none" stroke="url(#com-gold2)" stroke-width="8" stroke-linecap="round"/>
    <path d="M34 -34 h16 a16 16 0 0 1 -16 30" fill="none" stroke="url(#com-gold2)" stroke-width="8" stroke-linecap="round"/>
    <!-- copa -->
    <path d="M-34 -46 H34 V-12 A34 34 0 0 1 -34 -12 Z" fill="url(#com-gold)"/>
    <rect x="-38" y="-52" width="76" height="10" rx="5" fill="url(#com-gold2)"/>
    <!-- pie -->
    <rect x="-6" y="22" width="12" height="20" fill="url(#com-gold2)"/>
    <path d="M-24 42 H24 L28 56 H-28 Z" fill="url(#com-gold)"/>
    <!-- balón grabado -->
    <circle cy="-24" r="13" fill="#1B1740" opacity="0.55"/>
    <path d="M0 -35 L9.5 -28.4 L5.9 -17.2 H-5.9 L-9.5 -28.4 Z" fill="#FBE38A" opacity="0.9"/>
  </g>

  <!-- año -->
  <text x="160" y="286" text-anchor="middle"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700"
        fill="#D4AF37" letter-spacing="6">2026</text>

  <circle cx="160" cy="160" r="158" fill="none" stroke="#D4AF37" stroke-opacity="0.3" stroke-width="3"/>
</svg>
