<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Claude Invoice Agent">
  <defs>
    <radialGradient id="inv-bg" cx="35%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="60%" stop-color="#0F2136"/>
      <stop offset="100%" stop-color="#080F1A"/>
    </radialGradient>
    <linearGradient id="inv-sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="inv-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="inv-sheet2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <circle cx="160" cy="160" r="160" fill="url(#inv-bg)"/>

  <!-- PDF de origen -->
  <g transform="rotate(-8 128 150)">
    <rect x="76" y="72" width="104" height="136" rx="9" fill="url(#inv-sheet)"/>
    <path d="M152 72 h28 v28 z" fill="#94A3B8"/>
    <g fill="#64748B">
      <rect x="92" y="104" width="58" height="7" rx="3.5"/>
      <rect x="92" y="122" width="72" height="5" rx="2.5"/>
      <rect x="92" y="136" width="72" height="5" rx="2.5"/>
      <rect x="92" y="150" width="48" height="5" rx="2.5"/>
    </g>
    <g fill="#3B82F6" opacity="0.55">
      <rect x="92" y="170" width="72" height="5" rx="2.5"/>
      <rect x="92" y="184" width="40" height="5" rx="2.5"/>
    </g>
    <!-- haz de escaneo OCR -->
    <rect x="72" y="140" width="112" height="14" fill="url(#inv-beam)"/>
    <rect x="72" y="146" width="112" height="2.5" fill="#67E8F9"/>
  </g>

  <!-- Excel de salida -->
  <g transform="rotate(7 214 186)">
    <rect x="166" y="128" width="106" height="118" rx="9" fill="url(#inv-sheet)"/>
    <rect x="166" y="128" width="106" height="24" rx="9" fill="url(#inv-sheet2)"/>
    <rect x="166" y="144" width="106" height="8" fill="url(#inv-sheet2)"/>
    <g stroke="#94A3B8" stroke-width="1.6">
      <path d="M166 176 H272 M166 200 H272 M166 224 H272"/>
      <path d="M200 152 V246 M236 152 V246"/>
    </g>
    <g fill="#334155">
      <rect x="174" y="160" width="18" height="6" rx="3"/>
      <rect x="208" y="160" width="18" height="6" rx="3"/>
      <rect x="244" y="160" width="18" height="6" rx="3"/>
    </g>
    <rect x="240" y="228" width="26" height="10" rx="5" fill="#059669"/>
  </g>

  <!-- chispa del agente IA -->
  <g transform="translate(214 76)">
    <circle r="26" fill="#3B82F6" opacity="0.18"/>
    <circle r="17" fill="#0F2136" stroke="#60A5FA" stroke-width="2"/>
    <path d="M0 -11 L3.2 -3.2 L11 0 L3.2 3.2 L0 11 L-3.2 3.2 L-11 0 L-3.2 -3.2 Z" fill="#93C5FD"/>
  </g>

  <circle cx="160" cy="160" r="158" fill="none" stroke="#60A5FA" stroke-opacity="0.25" stroke-width="3"/>
</svg>
