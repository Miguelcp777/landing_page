<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Entrenador Maraton">
  <defs>
    <radialGradient id="mar-bg" cx="35%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#124A3F"/>
      <stop offset="60%" stop-color="#0A2A28"/>
      <stop offset="100%" stop-color="#04140F"/>
    </radialGradient>
    <linearGradient id="mar-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <circle cx="160" cy="160" r="160" fill="url(#mar-bg)"/>

  <!-- anillo de macrociclo: progreso del plan -->
  <circle cx="160" cy="160" r="104" fill="none" stroke="#0E3B33" stroke-width="16"/>
  <circle cx="160" cy="160" r="104" fill="none" stroke="url(#mar-ring)" stroke-width="16"
          stroke-linecap="round" stroke-dasharray="480 654" transform="rotate(-90 160 160)"/>
  <!-- marcas de bloque -->
  <g stroke="#04140F" stroke-width="3">
    <path d="M160 48 v16" transform="rotate(60 160 160)"/>
    <path d="M160 48 v16" transform="rotate(150 160 160)"/>
    <path d="M160 48 v16" transform="rotate(240 160 160)"/>
  </g>

  <!-- pulso / HRV -->
  <path d="M86 152 H112 L122 126 L136 178 L150 140 L158 152 H184"
        fill="none" stroke="#6EE7B7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- distancia -->
  <text x="160" y="216" text-anchor="middle"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700"
        fill="#E2F5EE" letter-spacing="1">42,195</text>
  <text x="160" y="234" text-anchor="middle"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600"
        fill="#5EEAD4" letter-spacing="4">KM</text>

  <!-- chispa del coach IA -->
  <g transform="translate(228 92)">
    <circle r="27" fill="#3B82F6" opacity="0.18"/>
    <circle r="18" fill="#04140F" stroke="#60A5FA" stroke-width="2"/>
    <path d="M0 -11.5 L3.4 -3.4 L11.5 0 L3.4 3.4 L0 11.5 L-3.4 3.4 L-11.5 0 L-3.4 -3.4 Z" fill="#93C5FD"/>
  </g>

  <circle cx="160" cy="160" r="158" fill="none" stroke="#34D399" stroke-opacity="0.25" stroke-width="3"/>
</svg>
