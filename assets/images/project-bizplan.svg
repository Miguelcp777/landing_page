<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Business Plan Tool">
  <defs>
    <radialGradient id="biz-bg" cx="35%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#3B2A63"/>
      <stop offset="60%" stop-color="#1E1533"/>
      <stop offset="100%" stop-color="#0D0819"/>
    </radialGradient>
    <linearGradient id="biz-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="biz-bar2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#F9A8D4"/>
    </linearGradient>
  </defs>

  <circle cx="160" cy="160" r="160" fill="url(#biz-bg)"/>

  <!-- ventana de escritorio -->
  <rect x="52" y="70" width="216" height="164" rx="14" fill="#141024" stroke="#6D4AAE" stroke-width="2"/>
  <rect x="52" y="70" width="216" height="30" rx="14" fill="#241A3E"/>
  <rect x="52" y="88" width="216" height="12" fill="#241A3E"/>
  <g>
    <circle cx="72" cy="85" r="4.5" fill="#F87171"/>
    <circle cx="88" cy="85" r="4.5" fill="#FBBF24"/>
    <circle cx="104" cy="85" r="4.5" fill="#34D399"/>
  </g>
  <rect x="180" y="80" width="70" height="10" rx="5" fill="#3C2D63"/>

  <!-- barras de revenue -->
  <g>
    <rect x="76" y="176" width="20" height="38" rx="4" fill="url(#biz-bar)"/>
    <rect x="106" y="156" width="20" height="58" rx="4" fill="url(#biz-bar)"/>
    <rect x="136" y="164" width="20" height="50" rx="4" fill="url(#biz-bar2)"/>
    <rect x="166" y="132" width="20" height="82" rx="4" fill="url(#biz-bar)"/>
    <rect x="196" y="118" width="20" height="96" rx="4" fill="url(#biz-bar)"/>
  </g>
  <path d="M76 214 H244" stroke="#6D4AAE" stroke-width="2" stroke-linecap="round"/>

  <!-- línea de tendencia -->
  <path d="M86 190 L116 168 L146 176 L176 144 L206 126 L236 112"
        fill="none" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="236" cy="112" r="5.5" fill="#22D3EE"/>
  <circle cx="236" cy="112" r="11" fill="#22D3EE" opacity="0.22"/>

  <!-- indicador de riesgo -->
  <g transform="translate(232 168)">
    <circle r="21" fill="#0D0819" stroke="#FBBF24" stroke-width="2.5"/>
    <path d="M0 -11 L11 8 H-11 Z" fill="none" stroke="#FBBF24" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="-1.5" y="-3" width="3" height="7" rx="1.5" fill="#FBBF24"/>
    <circle cy="6.5" r="1.8" fill="#FBBF24"/>
  </g>

  <!-- base del portátil -->
  <path d="M36 244 H284 L272 258 H48 Z" fill="#241A3E" stroke="#6D4AAE" stroke-width="2" stroke-linejoin="round"/>

  <circle cx="160" cy="160" r="158" fill="none" stroke="#A78BFA" stroke-opacity="0.25" stroke-width="3"/>
</svg>
