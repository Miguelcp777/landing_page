<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img"
     aria-label="Revenue bridge: committed base, churn, risk, pipeline, planned">
  <title>Contract Revenue Planner — revenue bridge</title>
  <!-- An illustration, not a screen capture. The ratio matches the card's crop box
       so nothing is cut off. Figures are the synthetic dataset's own, rounded. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f8f6"/>
      <stop offset="1" stop-color="#eaece7"/>
    </linearGradient>
    <style>
      .g  { fill:#235d47 }
      .up { fill:#3f8f6b }
      .dn { fill:#b4553f }
      .gr { stroke:#dfe3db; stroke-width:1.5 }
      .ax { stroke:#c4cabd; stroke-width:2 }
      .lb { fill:#6d7568; font:500 17px system-ui,-apple-system,"Segoe UI",sans-serif }
      .vl { fill:#3c4438; font:600 18px ui-monospace,SFMono-Regular,Menlo,monospace }
      .ti { fill:#1d2a22; font:700 26px system-ui,-apple-system,"Segoe UI",sans-serif }
      .st { fill:#7c8476; font:500 16px system-ui,-apple-system,"Segoe UI",sans-serif }
      .cn { fill:#969e8e; font:500 14px system-ui,-apple-system,"Segoe UI",sans-serif }
      .dash { stroke:#9aa393; stroke-width:1.8; stroke-dasharray:5 6 }
    </style>
  </defs>

  <rect width="1200" height="470" fill="url(#bg)"/>

  <text class="ti" x="56" y="54">Revenue bridge</text>
  <text class="st" x="56" y="80">Committed base to planned · synthetic portfolio</text>

  <g class="gr">
    <line x1="56" y1="150" x2="1144" y2="150"/>
    <line x1="56" y1="230" x2="1144" y2="230"/>
    <line x1="56" y1="310" x2="1144" y2="310"/>
  </g>
  <line class="ax" x1="56" y1="386" x2="1144" y2="386"/>

  <!-- 1 committed base -->
  <rect class="g"  x="104" y="142" width="126" height="244" rx="4"/>
  <text class="vl" x="167" y="130" text-anchor="middle">1.00M</text>
  <text class="lb" x="167" y="416" text-anchor="middle">Committed</text>

  <line class="dash" x1="230" y1="142" x2="310" y2="142"/>

  <!-- 2 churn -->
  <rect class="dn" x="310" y="142" width="126" height="30" rx="4"/>
  <text class="vl" x="373" y="130" text-anchor="middle">&#8722;30k</text>
  <text class="lb" x="373" y="416" text-anchor="middle">Churn</text>

  <line class="dash" x1="436" y1="172" x2="516" y2="172"/>

  <!-- 3 risk -->
  <rect class="dn" x="516" y="172" width="126" height="29" rx="4"/>
  <text class="vl" x="579" y="160" text-anchor="middle">&#8722;29k</text>
  <text class="lb" x="579" y="416" text-anchor="middle">Risk</text>

  <line class="dash" x1="642" y1="201" x2="722" y2="201"/>

  <!-- 4 pipeline -->
  <rect class="up" x="722" y="179" width="126" height="22" rx="4"/>
  <text class="vl" x="785" y="167" text-anchor="middle">+22k</text>
  <text class="lb" x="785" y="416" text-anchor="middle">Pipeline</text>

  <line class="dash" x1="848" y1="179" x2="928" y2="179"/>

  <!-- 5 planned -->
  <rect class="g"  x="928" y="179" width="126" height="207" rx="4"/>
  <text class="vl" x="991" y="167" text-anchor="middle">0.96M</text>
  <text class="lb" x="991" y="416" text-anchor="middle">Planned</text>

  <text class="cn" x="56" y="450">SYNTHETIC DATA &#183; GENERATED WITH A FIXED SEED</text>
</svg>
